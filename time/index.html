<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Time Converter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⏱%3C/text%3E%3C/svg%3E" />
<script>
  (function () {
    try {
      var t = localStorage.getItem('tc.theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #8a8a8a;
    --line: #222;
    --line-hover: #444;
    --card: #0a0a0a;
    --menu-bg: #0f0f0f;
    --menu-hover: #1a1a1a;
    --shadow: rgba(0, 0, 0, 0.6);
    --gold: var(--gold);
    --scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fafaf7;
    --fg: #111;
    --muted: #6b6b6b;
    --line: #e3e3e0;
    --line-hover: #b8b8b3;
    --card: #ffffff;
    --menu-bg: #ffffff;
    --menu-hover: #f1f1ee;
    --shadow: rgba(0, 0, 0, 0.12);
    --gold: #b8893a;
    --scheme: light;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans", "Yu Gothic", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .card, .lang-trigger, .lang-menu, .btn, input[type="time"], input[type="date"], select, .theme-toggle {
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 56px 32px 80px;
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 48px;
  }
  .header-text {
    min-width: 0;
  }
  h1 {
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
    max-width: 560px;
  }
  .lang-wrap {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .lang-caption {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .theme-toggle {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--line-hover); }
  .theme-toggle svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .theme-toggle .icon-sun { display: none; }
  .theme-toggle .icon-moon { display: block; }
  :root[data-theme="light"] .theme-toggle .icon-sun { display: block; }
  :root[data-theme="light"] .theme-toggle .icon-moon { display: none; }
  .grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 24px;
    align-items: stretch;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
    transition: border-color 0.2s ease;
    min-width: 0;
  }
  .card:focus-within {
    border-color: var(--line-hover);
  }
  .city-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .tz {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    letter-spacing: 0.04em;
  }
  .big-time {
    font-size: 56px;
    font-weight: 300;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    margin-bottom: 6px;
  }
  .big-date {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 24px;
    min-height: 20px;
  }
  .day-offset {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 7px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--line-hover);
    border-radius: 999px;
    color: var(--fg);
    vertical-align: middle;
  }
  .inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .field label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  input[type="time"],
  input[type="date"],
  select {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    outline: none;
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
  }
  :root { color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  input[type="time"]:hover,
  input[type="date"]:hover,
  select:hover {
    border-color: var(--line-hover);
  }
  input[type="time"]:focus,
  input[type="date"]:focus,
  select:focus {
    border-color: var(--fg);
  }
  /* City select: larger, with caret */
  select.city-select {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.005em;
    padding: 8px 32px 8px 12px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238a8a8a' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
  }
  select option, select optgroup {
    background: var(--menu-bg);
    color: var(--fg);
  }
  /* Custom language picker --------------------------- */
  .lang-picker {
    position: relative;
    display: inline-block;
  }
  .lang-trigger {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.2s ease;
    min-width: 170px;
  }
  .lang-trigger:hover { border-color: var(--line-hover); }
  .lang-trigger[aria-expanded="true"] { border-color: var(--fg); }
  .lang-trigger .globe {
    font-size: 15px;
    line-height: 1;
    /* Make sure emoji color is preserved on Apple platforms */
  }
  .lang-trigger .flag {
    font-size: 16px;
    line-height: 1;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  .lang-trigger .current-label {
    flex: 1;
    text-align: left;
    white-space: nowrap;
  }
  .lang-trigger .caret {
    color: var(--muted);
    font-size: 10px;
    line-height: 1;
    transition: transform 0.2s ease;
  }
  .lang-trigger[aria-expanded="true"] .caret { transform: rotate(180deg); }

  .lang-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: var(--menu-bg);
    border: 1px solid var(--line-hover);
    border-radius: 10px;
    padding: 6px;
    min-width: 200px;
    max-height: 360px;
    overflow-y: auto;
    z-index: 50;
    box-shadow: 0 12px 32px var(--shadow);
  }
  .lang-menu[hidden] { display: none; }
  .lang-option {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: transparent;
    color: var(--fg);
    border: 0;
    border-radius: 6px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    transition: background-color 0.15s ease;
  }
  .lang-option:hover, .lang-option:focus { background: var(--menu-hover); outline: none; }
  .lang-option.selected { background: var(--menu-hover); }
  .lang-option .flag {
    font-size: 18px;
    line-height: 1;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    width: 22px;
    text-align: center;
  }
  .lang-option .check {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
    opacity: 0;
  }
  .lang-option.selected .check { opacity: 1; }
  .arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 22px;
    user-select: none;
  }
  .footer {
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .footer-left {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover {
    border-color: var(--line-hover);
    color: var(--fg);
  }
  .save-default .star {
    color: var(--gold);
    font-size: 13px;
    line-height: 1;
    transition: color 0.2s ease;
  }
  /* "unsaved" (current ≠ default): active orange star, brighter label */
  .save-default:not(.saved) {
    color: var(--fg);
    border-color: var(--line-hover);
  }
  .save-default:not(.saved):hover {
    border-color: var(--gold);
  }
  /* "saved" state: muted */
  .save-default.saved {
    color: var(--muted);
    border-color: var(--line);
  }
  .save-default.saved .star {
    color: var(--muted);
  }
  .save-default.just-saved {
    border-color: var(--gold);
    color: var(--gold);
  }
  .save-default.just-saved .star {
    color: var(--gold);
  }
  .home-link {
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .home-link:hover {
    color: var(--fg);
  }
  .swap {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    padding: 0;
  }
  .swap:hover {
    border-color: var(--fg);
    color: var(--fg);
    transform: rotate(180deg);
  }

  @media (max-width: 720px) {
    html, body { overflow: hidden; height: 100%; }
    .page {
      padding: 14px 14px 14px;
      height: 100vh;
      height: 100dvh;
      max-width: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    header {
      flex-direction: row;
      align-items: center;
      gap: 10px;
      margin-bottom: 0;
    }
    .header-text { flex: 1; min-width: 0; }
    h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -0.005em; }
    .subtitle { display: none; }
    .lang-wrap { flex-shrink: 0; gap: 6px; }
    .lang-caption { font-size: 10px; line-height: 1.1; }
    .theme-toggle { width: 28px; height: 28px; }
    .theme-toggle svg { width: 14px; height: 14px; }
    .lang-picker { width: auto; }
    .lang-trigger {
      width: auto;
      min-width: 0;
      padding: 6px 10px;
      font-size: 12px;
      gap: 6px;
    }
    .lang-trigger .globe { font-size: 13px; }
    .lang-trigger .flag { font-size: 14px; }
    .lang-trigger .current-label {
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lang-menu { left: auto; right: 0; min-width: 180px; max-height: 60vh; }

    .grid {
      grid-template-columns: 1fr;
      gap: 8px;
      flex: 1;
      min-height: 0;
      align-items: stretch;
    }
    .card {
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .city-row { margin-bottom: 8px; gap: 8px; }
    select.city-select {
      font-size: 14px;
      font-weight: 500;
      padding: 6px 28px 6px 10px;
    }
    .tz { font-size: 10px; }
    .big-time {
      font-size: 32px;
      line-height: 1;
      margin-bottom: 3px;
    }
    .big-date {
      font-size: 11px;
      margin-bottom: 10px;
      min-height: 14px;
    }
    .day-offset { font-size: 9px; padding: 1px 5px; margin-left: 6px; }
    .inputs { gap: 6px; }
    .field { gap: 3px; }
    .field label { font-size: 9px; letter-spacing: 0.08em; }
    input[type="time"], input[type="date"] {
      font-size: 13px;
      padding: 6px 8px;
      border-radius: 6px;
    }

    .arrow { padding: 0; }
    .swap {
      width: 28px;
      height: 28px;
      transform: rotate(90deg);
      font-size: 12px;
    }
    .swap:hover { transform: rotate(270deg); }

    .footer {
      margin-top: 0;
      font-size: 11px;
      gap: 8px;
    }
    .footer-left { gap: 6px; }
    .btn { padding: 6px 9px; font-size: 11px; gap: 4px; }
    .save-default .star { font-size: 11px; }
  }

  /* Very small phones (< 380px wide or very short screens) */
  @media (max-width: 720px) and (max-height: 700px) {
    .page { padding: 10px 12px; gap: 6px; }
    .card { padding: 10px 12px; }
    .big-time { font-size: 28px; }
    .big-date { margin-bottom: 6px; }
    .city-row { margin-bottom: 6px; }
  }
</style>
  <script src="/track.js" defer></script>
</head>
<body>
  <div class="page">
    <header>
      <div class="header-text">
        <h1 id="page-title">Time Converter</h1>
        <p class="subtitle" id="page-subtitle">Type a time in either city. The other updates instantly.</p>
      </div>
      <div class="lang-wrap">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>
        </button>
        <span class="lang-caption" aria-hidden="true">Language 语言</span>
        <div class="lang-picker" id="lang-picker">
          <button class="lang-trigger" id="lang-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Language">
            <span class="globe" aria-hidden="true">🌐</span>
            <span class="flag" id="lang-current-flag" aria-hidden="true">🇺🇸</span>
            <span class="current-label" id="lang-current-label">English</span>
            <span class="caret" aria-hidden="true">▾</span>
          </button>
          <div class="lang-menu" id="lang-menu" role="listbox" hidden></div>
        </div>
      </div>
    </header>

    <div class="grid">
      <section class="card" id="card-a" aria-label="City A">
        <div class="city-row">
          <select class="city-select" id="city-a" aria-label="City A"></select>
          <span class="tz" id="tz-a"></span>
        </div>
        <div class="big-time" id="display-a">—</div>
        <div class="big-date" id="display-date-a"></div>
        <div class="inputs">
          <div class="field">
            <label for="time-a" id="label-time-a">Time</label>
            <input type="time" id="time-a" />
          </div>
          <div class="field">
            <label for="date-a" id="label-date-a">Date</label>
            <input type="date" id="date-a" />
          </div>
        </div>
      </section>

      <div class="arrow">
        <button class="swap" id="swap" aria-label="Swap cities" title="Swap">⇅</button>
      </div>

      <section class="card" id="card-b" aria-label="City B">
        <div class="city-row">
          <select class="city-select" id="city-b" aria-label="City B"></select>
          <span class="tz" id="tz-b"></span>
        </div>
        <div class="big-time" id="display-b">—</div>
        <div class="big-date" id="display-date-b"></div>
        <div class="inputs">
          <div class="field">
            <label for="time-b" id="label-time-b">Time</label>
            <input type="time" id="time-b" />
          </div>
          <div class="field">
            <label for="date-b" id="label-date-b">Date</label>
            <input type="date" id="date-b" />
          </div>
        </div>
      </section>
    </div>

    <div class="footer">
      <div class="footer-left">
        <button class="btn" id="btn-now">Use current time</button>
        <button class="btn save-default" id="btn-save-default" type="button">
          <span class="star" aria-hidden="true">★</span>
          <span class="label" id="save-default-label">Save as default</span>
        </button>
      </div>
      <a class="home-link" href="/">yiwen.bio</a>
    </div>
  </div>

<script>
(function () {
  // ---------- Data: cities (grouped by region) ----------
  // Display names per language fall back to English; native name shown in () when different.
  const CITIES = [
    // Americas
    { id: 'sf',  tz: 'America/Los_Angeles', region: 'americas', flag: '🇺🇸', en: 'San Francisco' },
    { id: 'la',  tz: 'America/Los_Angeles', region: 'americas', flag: '🇺🇸', en: 'Los Angeles' },
    { id: 'sea', tz: 'America/Los_Angeles', region: 'americas', flag: '🇺🇸', en: 'Seattle' },
    { id: 'den', tz: 'America/Denver',      region: 'americas', flag: '🇺🇸', en: 'Denver' },
    { id: 'chi', tz: 'America/Chicago',     region: 'americas', flag: '🇺🇸', en: 'Chicago' },
    { id: 'ny',  tz: 'America/New_York',    region: 'americas', flag: '🇺🇸', en: 'New York' },
    { id: 'tor', tz: 'America/Toronto',     region: 'americas', flag: '🇨🇦', en: 'Toronto' },
    { id: 'mex', tz: 'America/Mexico_City', region: 'americas', flag: '🇲🇽', en: 'Mexico City' },
    { id: 'sao', tz: 'America/Sao_Paulo',   region: 'americas', flag: '🇧🇷', en: 'São Paulo' },
    { id: 'bue', tz: 'America/Argentina/Buenos_Aires', region: 'americas', flag: '🇦🇷', en: 'Buenos Aires' },
    { id: 'anc', tz: 'America/Anchorage',   region: 'americas', flag: '🇺🇸', en: 'Anchorage' },
    { id: 'hnl', tz: 'Pacific/Honolulu',    region: 'americas', flag: '🇺🇸', en: 'Honolulu' },
    // Europe & Africa
    { id: 'lon', tz: 'Europe/London',       region: 'emea', flag: '🇬🇧', en: 'London' },
    { id: 'par', tz: 'Europe/Paris',        region: 'emea', flag: '🇫🇷', en: 'Paris' },
    { id: 'ber', tz: 'Europe/Berlin',       region: 'emea', flag: '🇩🇪', en: 'Berlin' },
    { id: 'mad', tz: 'Europe/Madrid',       region: 'emea', flag: '🇪🇸', en: 'Madrid' },
    { id: 'rom', tz: 'Europe/Rome',         region: 'emea', flag: '🇮🇹', en: 'Rome' },
    { id: 'ams', tz: 'Europe/Amsterdam',    region: 'emea', flag: '🇳🇱', en: 'Amsterdam' },
    { id: 'sto', tz: 'Europe/Stockholm',    region: 'emea', flag: '🇸🇪', en: 'Stockholm' },
    { id: 'mos', tz: 'Europe/Moscow',       region: 'emea', flag: '🇷🇺', en: 'Moscow' },
    { id: 'ist', tz: 'Europe/Istanbul',     region: 'emea', flag: '🇹🇷', en: 'Istanbul' },
    { id: 'cai', tz: 'Africa/Cairo',        region: 'emea', flag: '🇪🇬', en: 'Cairo' },
    { id: 'lag', tz: 'Africa/Lagos',        region: 'emea', flag: '🇳🇬', en: 'Lagos' },
    { id: 'jnb', tz: 'Africa/Johannesburg', region: 'emea', flag: '🇿🇦', en: 'Johannesburg' },

  // ---------- Time math ----------
  function partsInZone(utcMs, timeZone) {
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    });
    const parts = {};
    for (const p of fmt.formatToParts(new Date(utcMs))) {
      if (p.type !== 'literal') parts[p.type] = p.value;
    }
    if (parts.hour === '24') parts.hour = '00';
    return {
      year: +parts.year, month: +parts.month, day: +parts.day,
      hour: +parts.hour, minute: +parts.minute, second: +parts.second,
    };
  }

  function wallToUtc(y, m, d, h, mi, timeZone) {
    const guess = Date.UTC(y, m - 1, d, h, mi, 0);
    const p = partsInZone(guess, timeZone);
    const wallOfGuess = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
    const offset = wallOfGuess - guess;
    return guess - offset;
  }

  function tzAbbrev(utcMs, timeZone, bcp47) {
    const fmt = new Intl.DateTimeFormat(bcp47, {
      timeZone, timeZoneName: 'short',
      year: 'numeric', month: 'numeric', day: 'numeric',
    });
    for (const p of fmt.formatToParts(new Date(utcMs))) {
      if (p.type === 'timeZoneName') return p.value;
    }
    return '';
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatBigTime(utcMs, timeZone, bcp47) {
    return new Intl.DateTimeFormat(bcp47, {
      timeZone, hour: 'numeric', minute: '2-digit',
    }).format(new Date(utcMs));
  }

  function formatBigDate(utcMs, timeZone, bcp47) {
    return new Intl.DateTimeFormat(bcp47, {
      timeZone, weekday: 'long', month: 'long', day: 'numeric', year: 'numeric',
    }).format(new Date(utcMs));
  }

  function dayOffset(pA, pB) {
    const a = Date.UTC(pA.year, pA.month - 1, pA.day);
    const b = Date.UTC(pB.year, pB.month - 1, pB.day);
    return Math.round((b - a) / 86400000);
  }

  function offsetBadge(diff, t) {
    if (diff === 0) return '';
    if (diff === 1) return `<span class="day-offset">${t.nextDay}</span>`;
    if (diff === -1) return `<span class="day-offset">${t.prevDay}</span>`;
    const sign = diff > 0 ? '+' : '';
    return `<span class="day-offset">${sign}${diff}d</span>`;
  }

  function populateLangs() {

      btn.type = 'button';

      btn.setAttribute('role', 'option');
      btn.setAttribute('data-code', L.code);
      btn.setAttribute('aria-selected', L.code === lang ? 'true' : 'false');
      btn.innerHTML =
        `<span class="flag" aria-hidden="true">${L.flag}</span>` +
        `<span class="label">${L.label}</span>` +
        `<span class="check" aria-hidden="true">✓</span>`;
      btn.addEventListener('click', () => selectLang(L.code));
      els.langMenu.appendChild(btn);
    }
    updateLangTrigger();
  }

    LS.set('tc.lang', lang);
    applyStaticStrings();
    populateLangs();
    populateCities(els.cityA, cityAId);
    populateCities(els.cityB, cityBId);
    render();
    closeLangMenu();
  }

  function populateCities(selectEl, selectedId) {
    const t = STRINGS[lang] || STRINGS.en;
    selectEl.innerHTML = '';
    const groups = [
      ['americas', t.regions.americas],
      ['emea',     t.regions.emea],
      ['asia',     t.regions.asia],
      ['oceania',  t.regions.oceania],
      ['utc',      t.regions.utc],
    ];
    for (const [region, label] of groups) {
      const og = document.createElement('optgroup');
      og.label = label;
      const subset = CITIES.filter(c => c.region === region);
      // Sort alphabetically by localized name
      subset.sort((a, b) => cityDisplayName(a, lang).localeCompare(cityDisplayName(b, lang)));
      for (const c of subset) {
        const opt = document.createElement('option');
        opt.value = c.id;
        const native = cityDisplayName(c, lang);
        const name = native === c.en ? c.en : `${native} (${c.en})`;
        opt.textContent = `${c.flag}  ${name}`;
        if (c.id === selectedId) opt.selected = true;
        og.appendChild(opt);
      }
      selectEl.appendChild(og);
    }
  }

  function applyStaticStrings() {
    const t = STRINGS[lang] || STRINGS.en;
    document.documentElement.lang = lang === 'zh-tw' ? 'zh-TW' : lang;
    document.title = t.title;
    els.pageTitle.textContent = t.title;
    els.pageSubtitle.textContent = t.subtitle;
    els.labelTimeA.textContent = t.time;
    els.labelTimeB.textContent = t.time;
    els.labelDateA.textContent = t.date;
    els.labelDateB.textContent = t.date;
    els.btnNow.textContent = t.now;
    updateSaveButton();
  }

  // ---------- Render ----------
  let currentUtc = Date.now();

  function getCity(id) { return CITIES.find(c => c.id === id) || CITIES[0]; }

  function render() {
    const cityA = getCity(cityAId);
    const cityB = getCity(cityBId);
    const L = LANGS.find(l => l.code === lang) || LANGS[0];
    const bcp47 = L.bcp47;
    const t = STRINGS[lang] || STRINGS.en;

    const pA = partsInZone(currentUtc, cityA.tz);
    const pB = partsInZone(currentUtc, cityB.tz);

    els.timeA.value = `${pad(pA.hour)}:${pad(pA.minute)}`;
    els.dateA.value = `${pA.year}-${pad(pA.month)}-${pad(pA.day)}`;
    els.timeB.value = `${pad(pB.hour)}:${pad(pB.minute)}`;
    els.dateB.value = `${pB.year}-${pad(pB.month)}-${pad(pB.day)}`;

    els.dispA.textContent = formatBigTime(currentUtc, cityA.tz, bcp47);
    els.dispB.textContent = formatBigTime(currentUtc, cityB.tz, bcp47);

    const diffBtoA = dayOffset(pA, pB);
    els.dispDateA.innerHTML = formatBigDate(currentUtc, cityA.tz, bcp47);
    els.dispDateB.innerHTML = formatBigDate(currentUtc, cityB.tz, bcp47) + offsetBadge(diffBtoA, t);

    els.tzA.textContent = tzAbbrev(currentUtc, cityA.tz, bcp47);
    els.tzB.textContent = tzAbbrev(currentUtc, cityB.tz, bcp47);
  }

  function parseInputs(timeEl, dateEl, timeZone) {
    const tv = timeEl.value || '00:00';
    const dv = dateEl.value;
    const [hh, mm] = tv.split(':').map(Number);
    let y, m, d;
    if (dv) {
      [y, m, d] = dv.split('-').map(Number);
    } else {
      const p = partsInZone(currentUtc, timeZone);
      y = p.year; m = p.month; d = p.day;
    }
    return wallToUtc(y, m, d, hh, mm, timeZone);
  }

  // ---------- Wire up ----------
  function handleA() {
    currentUtc = parseInputs(els.timeA, els.dateA, getCity(cityAId).tz);
    render();
  }
  function handleB() {
    currentUtc = parseInputs(els.timeB, els.dateB, getCity(cityBId).tz);
    render();
  }

  els.timeA.addEventListener('input', handleA);
  els.dateA.addEventListener('input', handleA);
  els.timeB.addEventListener('input', handleB);
  els.dateB.addEventListener('input', handleB);

  els.cityA.addEventListener('change', (e) => {
    cityAId = e.target.value;
    render();
    updateSaveButton();
  });
  els.cityB.addEventListener('change', (e) => {
    cityBId = e.target.value;
    render();
    updateSaveButton();
  });

  els.swap.addEventListener('click', () => {
    [cityAId, cityBId] = [cityBId, cityAId];
    populateCities(els.cityA, cityAId);
    populateCities(els.cityB, cityBId);
    render();
    updateSaveButton();
  });

  function applyTheme() {
    if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  }

  els.themeToggle.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    LS.set(K_THEME, theme);
    applyTheme();
  });

  els.btnSaveDefault.addEventListener('click', () => {
    LS.set(K_DEFAULT_A, cityAId);
    LS.set(K_DEFAULT_B, cityBId);
    const t = STRINGS[lang] || STRINGS.en;
    els.btnSaveDefault.classList.remove('saved');
    els.btnSaveDefault.classList.add('just-saved');
    els.saveDefaultLabel.textContent = t.justSaved;
    setTimeout(() => {
      els.btnSaveDefault.classList.remove('just-saved');
      updateSaveButton();
    }, 1200);
  });

  function updateSaveButton() {
    if (!els.btnSaveDefault) return;
    if (els.btnSaveDefault.classList.contains('just-saved')) return;
    const t = STRINGS[lang] || STRINGS.en;
    if (isCurrentDefault()) {
      els.btnSaveDefault.classList.add('saved');
      els.saveDefaultLabel.textContent = t.defaultSaved;
    } else {
      els.btnSaveDefault.classList.remove('saved');
      els.saveDefaultLabel.textContent = t.saveDefault;
    }
  }

  els.langTrigger.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleLangMenu();
  });
  document.addEventListener('click', (e) => {
    if (!els.langPicker.contains(e.target)) closeLangMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !els.langMenu.hidden) closeLangMenu();
  });

  els.btnNow.addEventListener('click', () => {
    currentUtc = Date.now();
    render();
  });

  // ---------- Init ----------
  applyTheme();
  populateLangs();
  applyStaticStrings();
  populateCities(els.cityA, cityAId);
  populateCities(els.cityB, cityBId);
  render();
  updateSaveButton();
})();
</script>
</body>
</html>
